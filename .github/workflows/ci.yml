name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pyright
      - run: pytest -m "not slow" -n 2
      - name: chunk size (hand-written lines, tests and prose excluded; cap 150)
        if: github.event_name == 'pull_request' && !contains(join(github.event.pull_request.labels.*.name, ','), 'oversize-approved')
        run: scripts/chunk_size.sh "origin/${{ github.base_ref }}" 150
